const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 10000);
camera.position.set(2, 1.5, 3);

scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbbb, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(5, 8, 6); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.6); fill.position.set(-6, 3, -4); scene.add(fill);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

let current = null;
let home = null;

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

function disposeObject(o) {
  o.traverse(n => {
    if (n.geometry) n.geometry.dispose();
    if (n.material) [].concat(n.material).forEach(m => m.dispose());
  });
}

function frame(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  if (box.isEmpty()) { msg.textContent = 'Không tìm thấy hình học trong file này.'; return; }
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  obj.position.sub(center);              // đưa mô hình về gốc tọa độ
  const r = Math.max(size.x, size.y, size.z) || 1;
  const dist = r / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.6;
  camera.near = r / 1000; camera.far = r * 100; camera.updateProjectionMatrix();
  camera.position.set(dist * 0.7, dist * 0.5, dist * 0.9);
  controls.target.set(0, 0, 0);
  controls.minDistance = r * 0.1; controls.maxDistance = r * 20;
  controls.update();
  home = { pos: camera.position.clone(), target: controls.target.clone() };
}

function show(obj, name) {
  if (current) { scene.remove(current); disposeObject(current); }
  // vật liệu mặc định cho mesh không có vật liệu; hiển thị cả hai mặt (SketchUp hay có mặt lật)
  obj.traverse(n => {
    if (n.isMesh) {
      if (!n.material) n.material = new THREE.MeshStandardMaterial({ color: 0xcccccc });
      [].concat(n.material).forEach(m => { m.side = THREE.DoubleSide; });
    }
  });
  current = obj; scene.add(obj); frame(obj);
  msg.textContent = 'Đang xem: ' + name;
}

const plain = () => new THREE.MeshStandardMaterial({ color: 0xcfcfcf, roughness: 0.7, metalness: 0.05, side: THREE.DoubleSide });

async function load(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  msg.textContent = 'Đang tải ' + file.name + '…';
  try {
    if (ext === 'glb' || ext === 'gltf') {
      const buf = await file.arrayBuffer();
      const gltf = await new Promise((res, rej) => new GLTFLoader().parse(buf, '', res, rej));
      show(gltf.scene, file.name);
    } else if (ext === 'obj') {
      const obj = new OBJLoader().parse(await file.text());
      obj.traverse(n => { if (n.isMesh) n.material = plain(); });
      show(obj, file.name);
    } else if (ext === 'stl') {
      const geo = new STLLoader().parse(await file.arrayBuffer());
      geo.computeVertexNormals();
      show(new THREE.Mesh(geo, plain()), file.name);
    } else if (ext === 'dae') {
      const dae = new ColladaLoader().parse(await file.text(), '');
      show(dae.scene, file.name);
    } else if (ext === 'skp') {
      msg.textContent = 'Trình duyệt không đọc trực tiếp .skp. Hãy xuất từ SketchUp sang .glb / .obj / .dae rồi mở lại.';
    } else {
      msg.textContent = 'Định dạng .' + ext + ' chưa được hỗ trợ.';
    }
  } catch (e) {
    console.error(e);
    msg.textContent = 'Không đọc được file: ' + e.message;
  }
}

document.getElementById('file').addEventListener('change', e => { if (e.target.files[0]) load(e.target.files[0]); });
const drop = document.getElementById('drop');
addEventListener('dragover', e => { e.preventDefault(); drop.style.display = 'flex'; });
addEventListener('dragleave', e => { if (e.target === drop) drop.style.display = 'none'; });
addEventListener('drop', e => { e.preventDefault(); drop.style.display = 'none'; if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); });

document.getElementById('reset').onclick = () => {
  if (!home) return;
  camera.position.copy(home.pos); controls.target.copy(home.target); controls.update();
};
const spinBtn = document.getElementById('spin');
spinBtn.onclick = () => {
  controls.autoRotate = !controls.autoRotate;
  spinBtn.textContent = 'Tự xoay: ' + (controls.autoRotate ? 'bật' : 'tắt');
};

// Nạp sẵn mô hình CHIM-SCULPTURE đã nhúng trong trang
try {
  const text = document.getElementById('model-data').textContent;
  const dae = new ColladaLoader().parse(text, '');
  show(dae.scene, 'CHIM-SCULPTURE');
} catch (e) {
  console.error(e);
  msg.textContent = 'Không đọc được mô hình nhúng: ' + e.message;
}

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
